[project]
name = "turaista-model-tools"
version = "0.1.0"
description = "Export NLLB-200 to ONNX int8 for TurAIsta's on-device translation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Heavy (pulls torch). Install only when exporting: uv sync --extra export
export = [
    "optimum[onnxruntime]>=1.21",
    "transformers>=4.44",
    "sentencepiece>=0.2",
]

[project.scripts]
export-nllb = "model_tools.export_nllb:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "S"]
